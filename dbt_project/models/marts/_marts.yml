version: 2

models:
  - name: dim_patients
    description: One row per patient + Unknown member. No direct PII exposed.
    columns:
      - name: patient_key
        data_tests: [unique, not_null]
      - name: patient_id
        data_tests: [unique, not_null]
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: [male, female, other, unknown]
      - name: age_band
        data_tests:
          - accepted_values:
              arguments:
                values: ['0-17', '18-34', '35-49', '50-64', '65+', unknown]

  - name: dim_doctors
    columns:
      - name: doctor_key
        data_tests: [unique, not_null]
      - name: doctor_id
        data_tests: [unique, not_null]

  - name: dim_clinics
    columns:
      - name: clinic_key
        data_tests: [unique, not_null]
      - name: location_id
        data_tests: [unique, not_null]

  - name: dim_diseases
    columns:
      - name: disease_key
        data_tests: [unique, not_null]
      - name: disease_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_appointments
    description: "Grain: one row per appointment."
    data_tests:
      # Headline business rule: an appointment must end after it starts.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_time > start_time"
          config:
            where: "start_time is not null and end_time is not null"
            severity: error
      - dbt_utils.expression_is_true:
          name: wait_minutes_within_sane_range
          arguments:
            expression: "wait_minutes between 0 and 1440"
          config:
            where: "wait_minutes is not null"
            severity: warn
      - dbt_utils.expression_is_true:
          name: completed_not_also_cancelled
          arguments:
            expression: "not (is_completed and is_cancelled)"
    columns:
      - name: appointment_key
        data_tests: [unique, not_null]
      - name: appointment_id
        data_tests: [unique, not_null]
      - name: patient_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_patients'), field: patient_key}
      - name: doctor_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_doctors'), field: doctor_key}
      - name: clinic_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_clinics'), field: clinic_key}
      - name: disease_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_diseases'), field: disease_key}
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}

  - name: mart_daily_active_users
    description: >
      Daily active users. PROXY definition: distinct patients who booked an appointment or
      arrived for one on that day (the API exposes no login/session events).
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: daily_active_users
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: mart_wait_times
    description: Average / median / p90 wait (arrival -> start of care) per clinic per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, clinic_key]

  - name: mart_clinic_performance
    description: Monthly clinic scorecard.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [clinic_key, month_start]
    columns:
      - name: completion_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: no_show_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
