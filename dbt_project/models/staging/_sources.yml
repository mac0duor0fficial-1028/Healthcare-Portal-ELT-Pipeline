version: 2

sources:
  - name: api
    description: Raw JSON snapshots from the Doctor Appointment API (landed by extract_load).
    database: TELEHEALTH_RAW
    schema: API
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: raw_roles
      - name: raw_users
      - name: raw_locations
      - name: raw_diseases
      - name: raw_visiting_hours_schedules
      - name: raw_patients
      - name: raw_appointments
        columns:
          - name: payload
            data_tests: [not_null]
      - name: extract_log
        description: One audit row per endpoint per load (used for row-count reconciliation).
        config:
          freshness: null
