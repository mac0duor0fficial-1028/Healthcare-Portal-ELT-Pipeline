version: 2

models:
  - name: int_appointments_enriched
    description: Derived flags and timing metrics for each appointment.
    columns:
      - name: appointment_id
        data_tests: [unique, not_null]

unit_tests:
  - name: wait_minutes_is_arrival_to_consultation_start
    model: int_appointments_enriched
    given:
      - input: ref('stg_appointments')
        format: sql
        rows: |
          select 1 as appointment_id, 'completed' as status,
                 '2026-01-05 09:00:00'::timestamp_ntz as start_time,
                 '2026-01-05 09:30:00'::timestamp_ntz as end_time,
                 '2026-01-05 08:55:00'::timestamp_ntz as arrived_at,
                 '2026-01-05 09:15:00'::timestamp_ntz as consultation_started_at,
                 '2026-01-04 10:00:00'::timestamp_ntz as created_at
          union all
          -- arrived AFTER consultation start (bad data) -> wait must be NULL, not negative
          select 2, 'completed',
                 '2026-01-05 10:00:00'::timestamp_ntz, '2026-01-05 10:30:00'::timestamp_ntz,
                 '2026-01-05 10:20:00'::timestamp_ntz, '2026-01-05 10:10:00'::timestamp_ntz,
                 '2026-01-04 07:00:00'::timestamp_ntz
          union all
          -- never arrived
          select 3, 'cancelled',
                 '2026-01-05 11:00:00'::timestamp_ntz, '2026-01-05 11:30:00'::timestamp_ntz,
                 null::timestamp_ntz, null::timestamp_ntz, '2026-01-01 00:00:00'::timestamp_ntz
    expect:
      rows:
        - {appointment_id: 1, wait_minutes: 20, arrival_delay_minutes: -5, scheduled_duration_min: 30, booking_lead_time_hours: 23, is_completed: true, is_cancelled: false}
        - {appointment_id: 2, wait_minutes: null, arrival_delay_minutes: 20, scheduled_duration_min: 30, booking_lead_time_hours: 27, is_completed: true, is_cancelled: false}
        - {appointment_id: 3, wait_minutes: null, arrival_delay_minutes: null, scheduled_duration_min: 30, booking_lead_time_hours: 107, is_completed: false, is_cancelled: true}

  - name: status_flags_are_case_insensitive_and_exclusive
    model: int_appointments_enriched
    given:
      - input: ref('stg_appointments')
        format: sql
        rows: |
          select 1 as appointment_id, 'Completed' as status,
                 null::timestamp_ntz as start_time, null::timestamp_ntz as end_time,
                 null::timestamp_ntz as arrived_at, null::timestamp_ntz as consultation_started_at,
                 null::timestamp_ntz as created_at
          union all select 2, 'no_show', null, null, null, null, null
          union all select 3, 'scheduled', null, null, null, null, null
    expect:
      rows:
        - {appointment_id: 1, is_completed: true,  is_cancelled: false, is_no_show: false}
        - {appointment_id: 2, is_completed: false, is_cancelled: false, is_no_show: true}
        - {appointment_id: 3, is_completed: false, is_cancelled: false, is_no_show: false}
